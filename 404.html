<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18130f">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/verivo/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/verivo/styles/main.css">
    <script src="/verivo/scripts/main.js" defer></script>
    <title>404 — VERIVO</title>
  </head>
  <body class="error-page">
    <div class="language-switcher error-language" role="group" aria-label="Language">
      <button type="button" data-language-control="uk" aria-pressed="true">UA</button>
      <span aria-hidden="true">/</span>
      <button type="button" data-language-control="en" aria-pressed="false">EN</button>
    </div>

    <main class="error-content">
      <p class="error-code">VERIVO / 404</p>

      <div data-language="uk">
        <h1>Слід втрачено.</h1>
        <p>Цієї сторінки немає в історії. Поверніться до початку.</p>
        <a class="button" href="/verivo/">На головну</a>
      </div>

      <div data-language="en" hidden>
        <h1>Trace not found.</h1>
        <p>This page is not part of the history. Return to the beginning.</p>
        <a class="button" href="/verivo/">Go home</a>
      </div>
    </main>
  </body>
</html>
